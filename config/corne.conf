# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KEYBOARD_NAME="NullDeck"
# Only the left half has USB HID; the right half warns that this is ignored, which is harmless.
# (ZMK skips corne_left.conf when corne.conf exists, so it can't be split out.)
CONFIG_ZMK_USB=y
# Default TX power (0 dBm). Add CONFIG_BT_CTLR_TX_PWR_PLUS_8=y back if Bluetooth drops out.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Central fetches the right half's battery level and exposes it to the host as a
# second battery service. Most hosts (Windows included) only show the first one.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# TPS43 trackpad on peripheral (right) side
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_TPS43=y
