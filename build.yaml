# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
#
---
include:
  # raw_hid_adapter goes on the left half only: it is the split central, so it owns
  # layer state and the link to the computer that the Null Keys overlay reads.
  - board: nice_nano//zmk
    shield: corne_left raw_hid_adapter
    artifact-name: corne_left-nice_nano_v2
  - board: nice_nano//zmk
    shield: corne_right
    artifact-name: corne_right-nice_nano_v2
